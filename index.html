<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عراقزون | IraqZone</title>
    
    <style>
        /* تصفير كل الهوامش والحواف في المتصفح */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* استخدام لون خلفية متجرك الغامق منعاً لظهور وميض أبيض أثناء التحميل */
            background-color: #071c22; 
        }

        /* جعل حاوية المتجر تمتد على كامل مساحة الشاشة بشكل مطلق */
        .store-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="store-container">
        <iframe 
            src="https://iraqi-store.streamlit.app/?embed=1" 
            allowfullscreen="true"
            scrolling="yes"
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
