<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عراقزون | IraqZone</title>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
            overflow: hidden !important; /* منع أي التواء أو تمرير خارجي */
            background-color: #071c22 !important; /* لون متجرك الداكن */
        }
        
        /* الحاوية الأساسية تعمل كمقص حاد لشاشة العرض */
        .store-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden !important; /* هذا السطر يقص أي شيء يخرج عن حدود الشاشة */
        }

        /* تكبير حجم إطار ستريمليت ميكانيكياً لدفعه لأسفل خارج الرؤية */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            
            /* نزيد الارتفاع بـ 45 بكسل لتختفي أزرار ستريمليت في المنطقة المحجوبة */
            height: calc(100% + 45px) !important; 
            
            border: none !important;
            outline: none !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="store-container">
        <iframe 
            src="https://iraqi-store.streamlit.app/?embed=true" 
            allowfullscreen="true"
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
