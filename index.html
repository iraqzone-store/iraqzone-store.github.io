<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عراقزون | IraqZone</title>
    <style>
        /* تصفير حاسم لكل حواف المتصفح الخارجي */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
            overflow: hidden !important; /* يمنع ظهور شريط التمرير الخارجي تماماً */
            background-color: #071c22 !important; /* نفس لون خلفية متجرك بالضبط */
        }
        
        .store-container {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            outline: none !important;
            display: block !important;
            overflow: hidden !important;
        }
    </style>
</head>
<body>

    <div class="store-container">
        <iframe 
            src="https://iraqi-store.streamlit.app/?embed=true" 
            allowfullscreen="true"
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
