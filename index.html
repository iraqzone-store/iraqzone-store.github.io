<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عراقزون | IraqZone</title>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #071c22 !important; /* تلوين الخلفية الأساسية بلون متجرك */
        }
        
        .store-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden !important; /* الـمقص الذكي الذي سيقطع الحواف البيضاء */
            background-color: #071c22 !important;
        }

        iframe {
            position: absolute;
            
            /* سحب الإطار للأعلى ولليسار بمقدار 5 بكسل لإخفاء الحافة العلوية والجانبية */
            top: -5px !important; 
            left: -5px !important;
            
            /* نزيد العرض بمقدار 10 بكسل لتعويض الخروج من الجانبين (يمين ويسار) */
            width: calc(100% + 10px) !important; 
            
            /* نزيد الارتفاع بمقدار 55 بكسل (5 بكسل للتعويض العلوي + 50 بكسل لإخفاء عبارات ستريمليت في الأسفل) */
            height: calc(100% + 55px) !important; 
            
            /* تصفير صارم وإلغاء أي ظلال أو حدود قد يصنعها المتصفح تلقائياً */
            border: 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

    <div class="store-container">
        <iframe 
            src="https://********.streamlit.app/?embed=true" 
            allowfullscreen="true"
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
